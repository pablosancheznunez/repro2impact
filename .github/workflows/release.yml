# Monthly release: if main changed and the tests pass, a patch version is
# tagged and published, and Zenodo mints its DOI. See
# pablosancheznunez/research-tools-ops.
name: Release

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: pablosancheznunez/research-tools-ops/.github/workflows/auto-release.yml@main
    with:
      setup: >-
        sudo apt-get update -qq && sudo apt-get install -y -qq r-base-core >/dev/null &&
        sudo Rscript -e 'options(repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest", HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os))); install.packages(c("testthat", "httr2", "jsonlite", "digest", "glmmTMB", "MatchIt", "cobalt", "fixest", "targets"))'
      test: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
    permissions:
      contents: write
