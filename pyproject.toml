[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repro2impact"
version = "0.1.0"
description = "Reproducible analysis scaffold for REPRO2IMPACT"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "statsmodels>=0.14,<1"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.scripts]
repro2impact = "repro2impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
